name: Build FF FULL SKIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android project
        run: |
          cordova create ffapp com.example.ffskin "FF FULL SKIN"
          cp index.html ffapp/www/index.html

      - name: Add Android platform
        run: |
          cd ffapp
          cordova platform add android

      - name: Build APK
        run: |
          cd ffapp
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-FULL-SKIN-APK
          path: ffapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
